const COL=["#B9C92B","#B9C92B","#B9C92B"],TT=["靜聽太平洋・部落與海岩","八部合音・鹿野高台的風","關山老街・紅豆香歸途"],DT=["10/16 五","10/17 六","10/18 日"];
const ico=n=>/🚕/.test(n)?"":/搭|車|區間|自強|普悠瑪|8101D|轉運/.test(n)?"🚆":/早|餐|水煎|吐司|豬血|微光|夜市|便當/.test(n)?"🍜":/退房|Check|換房/.test(n)?"🛏️":/部落劇場/.test(n)?"🎶":/DIY|琉璃/.test(n)?"💎":"📍";
const T0=new Date();if(T0.getFullYear()==2026&&T0.getMonth()==9&&T0.getDate()>=16&&T0.getDate()<=18)day=T0.getDate()-16;
function nowIdx(L){const n=new Date();if(!(n.getFullYear()==2026&&n.getMonth()==9&&n.getDate()==16+day))return-1;const m=n.getHours()*60+n.getMinutes();let r=-1;L.forEach((s,i)=>{const[h,mi]=s[0].split(":");if(h*60+ +mi<=m)r=i});return r}
let f="全部",CUR=[];
const cat=n=>/🚕/.test(n)||ico(n)=="🚆"?"交通":ico(n)=="🍜"?"吃":ico(n)=="🛏️"?"住":"玩";
const gal=(n,q)=>{for(const k in IMG)if((n+q).includes(k))return IMG[k];return[]};
const im=(u,c)=>`<img ${c||""} loading="lazy" decoding="async" src="${u}" onerror="this.remove()">`;
function render(){const d=D[day];document.documentElement.style.setProperty("--a",COL[day]);
$("tabs").innerHTML=D.map((x,i)=>`<button class="${i==day?"on":""}" onclick="day=${i};render()"><small>Day ${i+1}</small><b>${16+i}</b><small>週${DT[i].slice(-1)}</small></button>`).join("");
$("plan").innerHTML=d.plan?`<div class="plan"><p>週六 14:00 場要滿30人才演，預約電話確認後選一個：</p><div><button class="${pl=="A"?"on":""}" onclick="pl='A';render()">14:00 場（原案）</button><button class="${pl=="B"?"on":""}" onclick="pl='B';render()">10:30 場（提早）</button></div></div>`+(pl=="B"?'<div class="tip">⏰ 最晚 09:10 從市區出發；早餐提前到 07:15、退房提前到 08:30，前一晚先約車。</div>':""):"";
const L=d.plan?d[pl]:d.s,ni=nowIdx(L);CUR=L;
$("nx").innerHTML=ni>=0?`現在：<b>${L[ni][0]} ${L[ni][1]}</b>`+(L[ni+1]?`<br>下一站：${L[ni+1][0]} ${L[ni+1][1]}`:""):`<b>${DT[day]}</b>　${TT[day]}`;
$("chips").innerHTML=[["全部","✨"],["吃","🍜"],["玩","🎶"],["交通","🚆"],["住","🛏️"]].map(c=>`<button class="${c[0]==f?"on":""}" onclick="f='${c[0]}';render()">${c[1]} ${c[0]}</button>`).join("");
$("list").innerHTML=L.map((s,i)=>{const[t,n,q,ds,p,ty,a,b]=s,tx=ty=="taxi";if(f!="全部"&&cat(n)!=f)return"";const g=tx?[]:gal(n,q);
const link=tx?`<a class="m" href="${dir(a,b)}" target="_blank" onclick="event.stopPropagation()">🧭 看實際路線距離</a>`:q?`<a class="m" href="${mp(q)}" target="_blank" onclick="event.stopPropagation()">📍 地圖</a>`:"";
return`<div class="st ${tx?"taxi":""} ${i==ni?"now":""}" onclick="${tx?"this.classList.toggle('open')":`openD(${i})`}"><div class="hd"><span class="t">${t}</span>${tx&&ds?'<span class="car">細節 ▾</span>':""}${tx?"":`<span class="ic">${ico(n)}${g[0]?im(g[0]):""}</span>`}</div><div class="n">${n}</div>${tx&&ds?`<div class="d">${ds}</div>`:""}${p?`<span class="p">${p}</span>`:""}<div>${link}</div></div>`}).join("")}
function openD(i){const[t,n,q,ds,p]=CUR[i],g=gal(n,q);
$("dt").innerHTML=`<div class="dh"><span class="em">${ico(n)}</span>${g[0]?im(g[0]):""}<button class="cb" onclick="history.back()">‹</button><a class="cb r" href="${mp(q)}" target="_blank">📍</a><div class="dtt"><span class="pl">${DT[day]} ${t}</span><h2>${n}</h2></div></div><div class="db"><div class="cs"><span>🕒 ${t}</span>${p?`<span>💳 ${p}</span>`:""}</div>${ds?`<div class="tiles">${ds.split("\n").map(x=>`<div>${x}</div>`).join("")}</div>`:""}${g.length>1?`<div class="gr">${g.slice(1).map(u=>im(u)).join("")}</div>`:""}</div><div class="bar"><div><small>${p?"參考費用":"時間"}</small><b>${p||t}</b></div><a class="go" href="${mp(q)}" target="_blank">在 Google Maps 開啟</a></div>`;
$("dt").scrollTop=0;$("dt").classList.add("open");document.body.style.overflow="hidden";history.pushState({d:1},"")}
window.onpopstate=()=>{$("dt").classList.remove("open");document.body.style.overflow=""};
function view(i){document.querySelectorAll(".v").forEach((e,j)=>e.classList.toggle("on",i==j));[...$("nav").children].forEach((b,j)=>b.classList.toggle("on",i==j));if(i==3)sync()}
$("nav").innerHTML=[["🗓️","行程"],["ℹ️","須知"],["💰","預算"],["👫","分帳"]].map((e,i)=>`<button onclick="view(${i})"><i>${e[0]}</i>${e[1]}</button>`).join("");$("nav").children[0].classList.add("on");
$("notes").innerHTML="<b>行前須知</b>"+NOTES.map(n=>`<div class="d">• ${n}</div>`).join("");
const ck=CK.map(t=>({t,x:0}));function rck(){$("ck").innerHTML=ck.map((c,i)=>`<div class="ck ${c.x?"x":""}" onclick="ck[${i}].x^=1;rck()">${c.x?"☑":"☐"} ${c.t}</div>`).join("")}rck();
$("bud").innerHTML=BUD.map(([l,v])=>`<div class="row"><span>${l}</span><span>$${v.toLocaleString()}</span></div>`).join("")+`<div class="row"><b>總計</b><b>約$${BUD.reduce((s,r)=>s+r[1],0).toLocaleString()}</b></div><div class="d">計程車為距離試算，實際以跳表為準；不含伴手禮。</div>`;
/* 分帳：本機先顯示，進分帳頁才向雲端同步（只在頁面可見時、每10秒、內容有變才重畫） */
let ex=JSON.parse(localStorage.getItem("sp1")||"[]"),last="",timer;
function rsp(){$("sp").innerHTML=ex.map((e,i)=>`<div style="display:flex;gap:5px;margin-bottom:5px"><input style="flex:2" value="${e.name}" oninput="ex[${i}].name=this.value;sv()"><input style="flex:1.2" type="number" value="${e.amount}" oninput="ex[${i}].amount=+this.value||0;sv();calc()"><select onchange="ex[${i}].payer=this.value;sv();calc()"><option value="A" ${e.payer=="A"?"selected":""}>Gina</option><option value="B" ${e.payer=="B"?"selected":""}>念臻</option></select><button onclick="ex.splice(${i},1);rsp();sv()">✕</button></div>`).join("");calc()}
function calc(){const a=ex.filter(e=>e.payer=="A").reduce((s,e)=>s+e.amount,0),b=ex.filter(e=>e.payer=="B").reduce((s,e)=>s+e.amount,0),d=a-(a+b)/2;$("res").textContent=`Gina $${a} ／ 念臻 $${b}　`+(Math.abs(d)<1?"打平":d>0?`念臻付 Gina $${Math.round(d)}`:`Gina 付念臻 $${Math.round(-d)}`)}
let st;function sv(){localStorage.setItem("sp1",JSON.stringify(ex));clearTimeout(st);st=setTimeout(()=>fetch(DATA_API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"saveExpenses",expenses:ex})}).catch(()=>{}),800)}
$("add").onclick=()=>{ex.push({name:"",amount:0,payer:"A"});rsp();sv()};
async function sync(){clearTimeout(timer);if(!$("v3").classList.contains("on")||document.hidden)return;
try{const j=await(await fetch(DATA_API_URL+"?action=expenses&ts="+Date.now(),{cache:"no-store"})).json();const s=JSON.stringify(j.expenses);
if(Array.isArray(j.expenses)&&s!==last&&!document.activeElement.matches("input")){last=s;ex=j.expenses;localStorage.setItem("sp1",s);rsp()}}catch(e){}
timer=setTimeout(sync,10000)}
rsp();render();
</script></body></html>
