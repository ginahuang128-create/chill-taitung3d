/* 分帳：本機先顯示，進分帳頁才向雲端同步（只在頁面可見時、每10秒、內容有變才重畫） */
let ex=JSON.parse(localStorage.getItem("sp1")||"[]"),last="",timer;
function rsp(){$("sp").innerHTML=ex.map((e,i)=>`<div style="display:flex;gap:5px;margin-bottom:5px"><input style="flex:2" value="${e.name}" oninput="ex[${i}].name=this.value;sv()"><input style="flex:1.2" type="number" value="${e.amount}" oninput="ex[${i}].amount=+this.value||0;sv();calc()"><select onchange="ex[${i}].payer=this.value;sv();calc()"><option value="A" ${e.payer=="A"?"selected":""}>Gina</option><option value="B" ${e.payer=="B"?"selected":""}>念臻</option></select><button onclick="ex.splice(${i},1);rsp();sv()">✕</button></div>`).join("");calc()}
function calc(){const a=ex.filter(e=>e.payer=="A").reduce((s,e)=>s+e.amount,0),b=ex.filter(e=>e.payer=="B").reduce((s,e)=>s+e.amount,0),d=a-(a+b)/2;$("res").textContent=`Gina $${a} ／ 念臻 $${b}　`+(Math.abs(d)<1?"打平":d>0?`念臻付 Gina $${Math.round(d)}`:`Gina 付念臻 $${Math.round(-d)}`)}
let st;function sv(){localStorage.setItem("sp1",JSON.stringify(ex));clearTimeout(st);st=setTimeout(()=>fetch(DATA_API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"saveExpenses",expenses:ex})}).catch(()=>{}),800)}
$("add").onclick=()=>{ex.push({name:"",amount:0,payer:"A"});rsp();sv()};
async function sync(){clearTimeout(timer);if(!$("v3").classList.contains("on")||document.hidden)return;
try{const j=await(await fetch(DATA_API_URL+"?action=expenses&ts="+Date.now(),{cache:"no-store"})).json();const s=JSON.stringify(j.expenses);
if(Array.isArray(j.expenses)&&s!==last&&!document.activeElement.matches("input")){last=s;ex=j.expenses;localStorage.setItem("sp1",s);rsp()}}catch(e){}
timer=setTimeout(sync,10000)}
rsp();render();
</script></body></html>
