<style>

.sl{background:var(--lime);position:relative;display:flex;justify-content:center;padding-top:18px}
.sl span{writing-mode:vertical-rl;transform:rotate(180deg);align-self:flex-start;font-size:21px;letter-spacing:.22em;color:#CAFFA6;font-weight:500}

.st.now .sl{background:var(--ink)}.now .sl span{color:var(--lime)}.now .sl i{background:var(--lime);color:var(--ink)}
.sr{display:flex;flex-direction:column;min-width:0}.up{flex:1;padding:16px 16px 12px 18px;display:flex;justify-content:space-between;gap:10px;align-items:flex-start}

.ft{background:var(--yel);padding:12px 16px 12px 18px;display:flex;align-items:center;gap:16px}.ft div{min-width:0}.ft small{display:block;font-size:12px;color:var(--mu)}.ft b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

input,select{font:inherit;font-size:15px;padding:11px;border:0;border-radius:14px;min-width:0;background:var(--sage)}
nav{position:fixed;left:16px;right:16px;bottom:calc(12px + env(safe-area-inset-bottom));max-width:448px;margin:auto;display:flex;background:#fff;border-radius:99px;padding:6px;box-shadow:0 12px 28px -12px rgba(32,70,84,.45)}
nav button{flex:1;border:0;background:none;font:700 12px inherit;color:var(--mu);padding:8px 0;border-radius:99px}nav button i{display:block;font-style:normal;font-size:20px}nav button.on{background:var(--ink);color:#fff}
.dt{position:fixed;inset:0;z-index:50;background:#F7F9E1;overflow-y:auto;transform:translateY(100%);transition:transform .3s;max-width:480px;margin:auto}.dt.open{transform:none}
.dh{position:relative;height:390px;background:#A9E0F1;border-radius:0 0 52px 52px;overflow:hidden}.dh img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

.cb{position:absolute;top:calc(16px + env(safe-area-inset-top));left:16px;z-index:2;width:50px;height:50px;border-radius:50%;background:rgba(32,70,84,.5);border:0;display:flex;align-items:center;justify-content:center;text-decoration:none}.cb.r{left:auto;right:16px}
.dtt{position:absolute;left:22px;right:22px;bottom:30px;z-index:2;color:#fff}.mt{font-size:15px;font-weight:600}.dtt h2{font:700 36px/1.15 inherit;margin-top:8px;letter-spacing:-.01em}
.ey{text-align:center;margin:22px 0 14px;font:700 14px inherit;letter-spacing:.1em;color:#204654}
.db{padding:0 16px 24px}.cs{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-bottom:14px}.cs span{background:#fff;border-radius:99px;padding:12px 18px;font:600 15px inherit}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}.tiles div{background:var(--tint);border-radius:26px;padding:16px;min-height:96px;display:flex;flex-direction:column;justify-content:space-between;font-size:15px;font-weight:600;line-height:1.35}.tiles i{font-style:normal;font-size:20px;color:#204654}
.gr{display:grid;grid-template-columns:1fr 1fr;gap:10px}.gr img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:28px;background:#fff}
.bar{position:sticky;bottom:0;background:#F7F9E1;padding:14px 16px calc(14px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:14px;border-radius:32px 32px 0 0}

function nowIdx(L){const n=new Date();if(!(n.getFullYear()==2026&&n.getMonth()==9&&n.getDate()==16+day))return-1;const m=n.getHours()*60+n.getMinutes();let r=-1;L.forEach((s,i)=>{const[h,mi]=s[0].split(":");if(h*60+ +mi<=m)r=i});return r}
let f="全部",CUR=[];
const CL={交通:"行",吃:"美食",玩:"體驗",住:"住宿"},SY={全部:"✦",吃:"♨︎",玩:"♪",交通:"➤",住:"⌂"};
const cat=n=>{const c=ico(n);return c=="⇄"||c=="➤"?"交通":c=="♨︎"?"吃":c=="⌂"?"住":"玩"};
const gal=(n,q)=>{for(const k in IMG)if((n+q).includes(k))return IMG[k];return[]};
const im=u=>`<img loading="lazy" decoding="async" src="${u}" onerror="this.remove()">`;
const SV='<svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">',BK=SV+'<path d="M19 12H5M11 6l-6 6 6 6"/></svg>',PIN=SV+'<path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0113 0c0 5.4-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.4"/></svg>';

function render(){const d=D[day];document.documentElement.style.setProperty("--a",COL[day]);
$("tabs").innerHTML=D.map((x,i)=>`<button class="${i==day?"on":""}" onclick="day=${i};render()"><small>Day ${i+1}</small><b>${16+i}</b><small>週${DT[i].slice(-1)}</small></button>`).join("");
$("plan").innerHTML=d.plan?`<div class="plan"><p>週六 14:00 場要滿30人才演，預約電話確認後選一個：</p><div><button class="${pl=="A"?"on":""}" onclick="pl='A';render()">14:00 場（原案）</button><button class="${pl=="B"?"on":""}" onclick="pl='B';render()">10:30 場（提早）</button></div></div>`+(pl=="B"?'<div class="tip">◷ 最晚 09:10 從市區出發；早餐提前到 07:15、退房提前到 08:30，前一晚先約車。</div>':""):"";
const L=d.plan?d[pl]:d.s,ni=nowIdx(L);CUR=L;
$("chips").innerHTML=["全部","吃","玩","交通","住"].map(c=>`<button class="${c==f?"on":""}" onclick="f='${c}';render()"><em class="sy">${SY[c]}</em> ${c=="交通"?"行":c}</button>`).join("");
$("list").innerHTML=L.map((s,i)=>{const[t,n,q,ds,p,ty,a,b]=s,c=cat(n);if(f!="全部"&&c!=f)return"";
if(ty=="taxi")return`<div class="st taxi" onclick="this.classList.toggle('open')"><div class="hd"><span class="t">${t}</span>${ds?'<span class="car">細節 ▾</span>':""}</div><div class="n">${n}</div>${ds?`<div class="d">${ds}</div>`:""}${p?`<span class="p">${p}</span>`:""}<div><a class="m" href="${dir(a,b)}" target="_blank" onclick="event.stopPropagation()">➤ 看實際路線距離</a></div></div>`;
const g=gal(n,q);
return`<div class="st ${i==ni?"now":""}" onclick="openD(${i})"><div class="sl"><span>${c=="交通"?"交通":CL[c]}</span><i>${ico(n)}</i></div><div class="sr"><div class="up"><div><div class="t">${t}</div><div class="n">${n}</div></div><span class="ic">${ico(n)}${g[0]?im(g[0]):""}</span></div><div class="ft"><div><small>類型</small><b>${CL[c]}</b></div><div><small>費用</small><b>${p||"—"}</b></div></div></div></div>`}).join("")}
const FI=x=>/電話|\d{3}-\d{3}/.test(x)?"☎︎":/\$|費|現金|元/.test(x)?"＄":/分|時|:|點/.test(x)?"◷":/訂|預約|憑證/.test(x)?"✎":/長褲|包鞋|手電|防曬|防蚊|外套/.test(x)?"❖":"✦";
function openD(i){const[t,n,q,ds,p]=CUR[i],g=gal(n,q),c=cat(n),segs=(ds||"").split(/[\n，；]/).map(x=>x.trim()).filter(Boolean);
$("dt").innerHTML=`<div class="dh"><span class="em">${ico(n)}</span>${g[0]?im(g[0]):""}<button class="cb" onclick="history.back()">${BK}</button><a class="cb r" href="${mp(q)}" target="_blank">${PIN}</a><div class="dtt"><div class="mt"><em class="sy">${SY[c]}</em> ${CL[c]}　${DT[day]} ${t}</div><h2>${n}</h2></div></div><div class="ey"><em class="sy">✦</em> TAITUNG ・ DAY ${day+1}</div><div class="ttl">${TT[day]}</div><div class="db"><div class="cs"><span><em class="sy">◷</em> ${t}</span>${p?`<span><em class="sy">＄</em> ${p}</span>`:""}</div>${segs.length?`<div class="tiles">${segs.map(x=>`<div><i>${FI(x)}</i>${x}</div>`).join("")}</div>`:""}${g.length>1?`<div class="gr">${g.slice(1).map(im).join("")}</div>`:""}</div><div class="bar"><div><small>${p?"參考費用":"時間"}</small><b>${p||t}</b></div><a class="go" href="${mp(q)}" target="_blank">Google Maps</a></div>`;
$("dt").scrollTop=0;$("dt").classList.add("open");document.body.style.overflow="hidden";history.pushState({d:1},"")}
window.onpopstate=()=>{$("dt").classList.remove("open");document.body.style.overflow=""};
function view(i){document.querySelectorAll(".v").forEach((e,j)=>e.classList.toggle("on",i==j));[...$("nav").children].forEach((b,j)=>b.classList.toggle("on",i==j));if(i==1)FP.enter();else FP.stop();if(i==4)sync()}
$("nav").innerHTML=[["☰","行程"],["◎","足跡"],["ⓘ","須知"],["＄","預算"],["÷","分帳"]].map((e,i)=>`<button onclick="view(${i})"><i>${e[0]}</i>${e[1]}</button>`).join("");$("nav").children[0].classList.add("on");
$("notes").innerHTML="<b>行前須知</b>"+NOTES.map(n=>`<div class="d nt">• ${n}</div>`).join("");
const ck=CK.map(t=>({t,x:0}));function rck(){$("ck").innerHTML=ck.map((c,i)=>`<div class="ck ${c.x?"x":""}" onclick="ck[${i}].x^=1;rck()"><em class="sy">${c.x?"●":"○"}</em> ${c.t}</div>`).join("")}rck();
$("bud").innerHTML=BUD.map(([l,v])=>`<div class="row"><span>${l}</span><span>$${v.toLocaleString()}</span></div>`).join("")+`<div class="row"><b>總計</b><b>約$${BUD.reduce((s,r)=>s+r[1],0).toLocaleString()}</b></div><div class="d">計程車為距離試算，實際以跳表為準；不含伴手禮。</div>`;
/* 分帳：本機先顯示，進分帳頁才向雲端同步（只在頁面可見時、每10秒、內容有變才重畫） */
let ex=JSON.parse(localStorage.getItem("sp1")||"[]"),last="",timer;
function rsp(){$("sp").innerHTML=ex.map((e,i)=>`<div style="display:flex;gap:5px;margin-bottom:5px"><input style="flex:2" value="${e.name}" oninput="ex[${i}].name=this.value;sv()"><input style="flex:1.2" type="number" value="${e.amount}" oninput="ex[${i}].amount=+this.value||0;sv();calc()"><select onchange="ex[${i}].payer=this.value;sv();calc()"><option value="A" ${e.payer=="A"?"selected":""}>Gina</option><option value="B" ${e.payer=="B"?"selected":""}>念臻</option></select><button onclick="ex.splice(${i},1);rsp();sv()">✕</button></div>`).join("");calc()}
function calc(){const a=ex.filter(e=>e.payer=="A").reduce((s,e)=>s+e.amount,0),b=ex.filter(e=>e.payer=="B").reduce((s,e)=>s+e.amount,0),d=a-(a+b)/2;$("res").textContent=`Gina $${a} ／ 念臻 $${b}　`+(Math.abs(d)<1?"打平":d>0?`念臻付 Gina $${Math.round(d)}`:`Gina 付念臻 $${Math.round(-d)}`)}
let st;function sv(){localStorage.setItem("sp1",JSON.stringify(ex));clearTimeout(st);st=setTimeout(()=>fetch(DATA_API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"saveExpenses",expenses:ex})}).catch(()=>{}),800)}
$("add").onclick=()=>{ex.push({name:"",amount:0,payer:"A"});rsp();sv()};
async function sync(){clearTimeout(timer);if(!$("v3").classList.contains("on")||document.hidden)return;
try{const j=await(await fetch(DATA_API_URL+"?action=expenses&ts="+Date.now(),{cache:"no-store"})).json();const s=JSON.stringify(j.expenses);
if(Array.isArray(j.expenses)&&s!==last&&!document.activeElement.matches("input")){last=s;ex=j.expenses;localStorage.setItem("sp1",s);rsp()}}catch(e){}
timer=setTimeout(sync,10000)}
rsp();render();
</script></body></html>
