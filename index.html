<style>

.tm{padding-top:15px;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.cd{background:#fff;border-radius:14px;border-left:4px solid var(--c);padding:11px 13px 12px;margin:6px 0}
.cd h3{font-size:16px;line-height:1.35}
.ad{display:block;font-size:12.5px;color:var(--mut);margin-top:2px;text-decoration:none}
.nt{font-size:13.5px;margin-top:6px;color:#4A4E3C}
.w{background:#FFF1D6;border-radius:8px;padding:6px 9px;font-size:13px;margin-top:7px}
.go{display:flex;gap:7px;margin-top:9px}
.tx{border-left-color:#8A9078}.tx .tm{color:var(--mut)}
.box{margin:12px 16px 0;background:#fff;border-radius:14px;padding:14px}
.box h2{font-size:15px;margin-bottom:8px}
.ln{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.ln:last-child{border:0}.ln span:last-child{color:var(--mut);white-space:nowrap}
.tot{display:flex;justify-content:space-between;font-weight:700;font-size:17px;padding-top:10px}
.nl{padding:8px 0 8px 16px;position:relative;font-size:13.5px;border-bottom:1px solid var(--line)}
.nl:before{content:"!";position:absolute;left:2px;color:#D9713F;font-weight:700}
.ck{display:flex;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}
.ck i{flex:none;width:22px;height:22px;border:1.5px solid #bbb;border-radius:6px;text-align:center;color:#fff;font-style:normal;line-height:19px}
.ck.x i{background:var(--c);border-color:var(--c)}.ck.x span{color:var(--mut);text-decoration:line-through}
.ex{display:flex;gap:6px;margin-bottom:7px}
.ex input,.ex select{min-width:0;padding:8px;border:1px solid var(--line);border-radius:8px;font:14px inherit;font-family:inherit;background:#fff}
</style>

["18:30","🍢","微光集晚餐","台東市 微光集 TTwilight Bazaar","週四至週日 17:00–22:00。","","w"]]},

const CHECK=["身分證／健保卡／信用卡","少量現金（計程車與小吃）","手機、行動電源、充電線","預約憑證截圖（台鐵、8101D、DIY、布農部落）","輕便短袖＋傍晚薄外套","好走的鞋（夜訪小野柳要長褲＋包鞋）","防曬用品","防蚊液、輕便雨具","頭燈／手電筒","水壺與個人藥品"];

const API="https://script.google.com/macros/s/AKfycbyUU_yCCJJj6sU5fVimHJI1uy-P4MPPBC3nfHvikEhryleF1KnuhB_LCv4rFzoXO6X7aw/exec";

const $=id=>document.getElementById(id),E=encodeURIComponent,G="https://www.google.com/maps/";

const ls={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let cur=ls.get("tab",0),plan=ls.get("plan","A"),checks=ls.get("checks",{}),exp=ls.get("exp",EXP.map(x=>({n:x[0],a:x[1],p:x[2]})));
const TABS=["Day 1","Day 2","Day 3","須知","預算","分帳"];

function bar(){

  document.documentElement.style.setProperty("--c",cur<3?DAYS[cur].c:"#2FA0C4");
}
function card(x){
  const [t,ic,n,q,d,w,m]=x,tx=ic==="🚕"?" tx":"";
  const nav=m?`<a class="b p" target="_blank" rel="noopener" href="${G}dir/?api=1&destination=${E(q)}&travelmode=${{d:"driving",w:"walking",r:"transit"}[m]}">🧭 導航</a>`:"";
  return `<div class="it"><div class="tm">${t}</div><div class="cd${tx}"><h3>${ic} ${esc(n)}</h3>
  <a class="ad" target="_blank" rel="noopener" href="${G}search/?api=1&query=${E(q)}">📍 ${esc(q)}</a>
  <div class="nt">${esc(d)}</div>${w?`<div class="w">⚠ ${esc(w)}</div>`:""}
  <div class="go">${nav}<a class="b" target="_blank" rel="noopener" href="${G}search/?api=1&query=${E(q)}">看地圖</a></div></div></div>`;
}
function dayView(){
  const D=DAYS[cur],s=D.s||D[plan];
  const pts=s.map(x=>x[3]).filter((q,i,a)=>q!==a[i-1]);
  const route=pts.length>1?`${G}dir/?api=1&origin=${E(pts[0])}&destination=${E(pts[pts.length-1])}&waypoints=${E(pts.slice(1,-1).slice(0,9).join("|"))}`:"";
  let h=`<div class="hd"><b>${D.n} ・ ${D.d}</b><div class="sub" style="padding:2px 0 0">${D.t}</div></div>`;
  if(cur===1)h+=`<div class="seg"><button data-p="A" class="${plan==="A"?"on":""}">Plan A：14:00 場</button><button data-p="B" class="${plan==="B"?"on":""}">Plan B：10:30 場（早到）</button></div>
  <div class="box" style="margin-top:8px"><div style="font-size:13.5px">📞 <b>先打 089-561211#201</b>：問 14:00 場有沒有開（滿30人才演）。沒開就改 10:30，並確認射箭、午餐能排在 12:30 前後。<br><a class="b" style="margin-top:8px" href="tel:0895612110,201">撥號 089-561211 轉 201</a></div></div>`;
  h+=`<div class="row">${route?`<a class="b p" target="_blank" rel="noopener" href="${route}">🗺 整天路線（Google Maps）</a>`:""}</div>`;
  return h+s.map(card).join("");
}
function infoView(){
  const n=CHECK.filter((_,i)=>checks[i]).length;
  return `<div class="box"><h2>行前須知</h2>${NOTICES.map(x=>`<div class="nl">${esc(x)}</div>`).join("")}</div>
  <div class="box"><h2>行前清單 ${n}/${CHECK.length}</h2>${CHECK.map((x,i)=>`<div class="ck${checks[i]?" x":""}" data-k="${i}"><i>${checks[i]?"✓":""}</i><span>${esc(x)}</span></div>`).join("")}</div>`;
}
function budView(){
  const t=BUD.reduce((s,x)=>s+x[1],0);
  return `<div class="box"><h2>預算（每人，不含伴手禮）</h2>${BUD.map(x=>`<div class="ln"><span>${x[0]}</span><span>$${x[1].toLocaleString()}</span></div>`).join("")}
  <div class="tot"><span>總計</span><span>$${t.toLocaleString()}</span></div>
  <div class="nt">計程車跳錶估算：市區→布農部落約 $500–600／車，高台→鹿野站另約 $200–230。若上面的 $350 是整車預算會不夠；若是每人，兩人合計 $700 就夠。</div></div>`;
}
function settle(){
  const a=exp.filter(e=>e.p==="A").reduce((s,e)=>s+e.a,0),b=exp.filter(e=>e.p==="B").reduce((s,e)=>s+e.a,0),df=a-(a+b)/2;
  return {a,b,r:!(a+b)?"尚無支出":Math.abs(df)<1?"兩人打平":df>0?`念臻需付 Gina $${Math.round(df).toLocaleString()}`:`Gina 需付念臻 $${Math.round(-df).toLocaleString()}`};
}
function splitView(){
  const s=settle();
  return `<div class="box"><h2>分帳</h2>${exp.map((e,i)=>`<div class="ex" data-i="${i}"><input data-f="n" style="flex:2" value="${esc(e.n)}"><input data-f="a" type="number" inputmode="numeric" style="flex:1.2" value="${e.a}"><select data-f="p"><option value="A"${e.p==="A"?" selected":""}>Gina</option><option value="B"${e.p==="B"?" selected":""}>念臻</option></select><button class="b" data-del="${i}">✕</button></div>`).join("")}
  <button class="b" id="add" style="width:100%">＋ 新增支出</button>
  <div class="ln" style="margin-top:10px"><span>Gina 已付</span><span id="pa">$${s.a.toLocaleString()}</span></div><div class="ln"><span>念臻 已付</span><span id="pb">$${s.b.toLocaleString()}</span></div>
  <div class="tot"><span>結算</span><span id="settle" style="font-size:15px">${s.r}</span></div></div>`;
}
function render(){
  bar();
  $("main").innerHTML=[dayView,dayView,dayView,infoView,budView,splitView][cur]();
  scrollTo(0,0);
  if(cur===5)pull();
}
/* 分帳雲端同步：只在分帳頁開啟時才連線，不再背景輪詢 */
let pushT;
function save(){ls.set("exp",exp);clearTimeout(pushT);if(API)pushT=setTimeout(()=>fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"saveExpenses",expenses:exp.map(e=>({name:e.n,amount:e.a,payer:e.p}))})}).catch(()=>{}),800)}
function pull(){if(!API)return;fetch(API+"?action=expenses&ts="+Date.now(),{cache:"no-store"}).then(r=>r.json()).then(j=>{if(cur===5&&Array.isArray(j.expenses)&&j.expenses.length&&!document.activeElement.closest(".ex")){exp=j.expenses.map(e=>({n:e.name,a:Number(e.amount)||0,p:e.payer}));ls.set("exp",exp);$("main").innerHTML=splitView()}}).catch(()=>{})}

document.addEventListener("click",e=>{
  const t=e.target.closest(".tab"),p=e.target.closest("[data-p]"),k=e.target.closest("[data-k]"),d=e.target.closest("[data-del]");
  if(t){cur=+t.dataset.i;ls.set("tab",cur);render()}
  else if(p){plan=p.dataset.p;ls.set("plan",plan);const y=scrollY;render();scrollTo(0,y)}
  else if(k){const i=k.dataset.k;checks[i]=!checks[i];ls.set("checks",checks);const y=scrollY;render();scrollTo(0,y)}
  else if(d){exp.splice(+d.dataset.del,1);save();$("main").innerHTML=splitView()}
  else if(e.target.id==="add"){exp.push({n:"",a:0,p:"A"});save();$("main").innerHTML=splitView()}
});
document.addEventListener("input",e=>{
  const r=e.target.closest(".ex");if(!r)return;
  const i=+r.dataset.i,f=e.target.dataset.f;exp[i][f]=f==="a"?Number(e.target.value)||0:e.target.value;save();
  const s=settle();$("settle").textContent=s.r;$("pa").textContent="$"+s.a.toLocaleString();$("pb").textContent="$"+s.b.toLocaleString();
});
document.addEventListener("change",e=>{const r=e.target.closest(".ex");if(r&&e.target.dataset.f==="p"){exp[+r.dataset.i].p=e.target.value;save();const s=settle();$("settle").textContent=s.r;$("pa").textContent="$"+s.a.toLocaleString();$("pb").textContent="$"+s.b.toLocaleString()}});
render();
</script>
</body>
</html>
