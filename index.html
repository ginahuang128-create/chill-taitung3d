<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<title id="pageTitle">知本解憂．藍皮慢行 三日提案</title>
<link id="pageFavicon" rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>♨️</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4EEE0;--bg2:#EDE7D6;--ink:#1D2016;--muted:#7C806E;--line:#E7E2D2;--card:#FFFFFF;--pill:#14150F;
--d1:#2FA0C4;--d2:#C79A4B;--d3:#9B9B34;--sun:#F0A868;
--glass:rgba(255,255,255,.46);--glass-soft:rgba(255,255,255,.28);--glass-line:rgba(255,255,255,.65);--glass-line-soft:rgba(29,32,22,.1);
--glass-sheen:inset 0 1px 0 rgba(255,255,255,.85),inset 0 0 0 1px rgba(255,255,255,.18);
--card-sheen:inset 0 1px 0 rgba(255,255,255,.4);
--shadow:0 10px 24px -10px rgba(35,30,15,.22);--shadow-lg:0 20px 46px -14px rgba(35,30,15,.3);--shadow-soft:0 8px 20px -8px rgba(35,30,15,.16)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{color:var(--ink);background:
  radial-gradient(120% 60% at 15% -10%,rgba(47,160,196,.12),transparent 55%),
  radial-gradient(90% 50% at 100% 0%,rgba(240,168,104,.14),transparent 60%),
  linear-gradient(165deg,var(--bg),var(--bg2) 60%,var(--bg));
font-family:'Noto Sans TC',sans-serif;font-size:14.5px;line-height:1.55;
padding-bottom:calc(112px + env(safe-area-inset-bottom));max-width:480px;margin:0 auto;position:relative;min-height:100vh;isolation:isolate}
a{color:inherit}
::-webkit-scrollbar{display:none}

/* 背景霧感光暈：毛玻璃需要背後有東西可以「透」，用旅途主題色做柔和光斑＋緩慢漂浮的微粒，堆疊出高模糊景深 */
.bg-glow{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.bg-glow i{position:absolute;border-radius:50%;filter:blur(70px);animation:drift 22s ease-in-out infinite alternate}
.bg-glow i:nth-child(1){width:340px;height:340px;top:-110px;left:-100px;background:var(--d1);opacity:.4;animation-duration:26s}
.bg-glow i:nth-child(2){width:300px;height:300px;top:190px;right:-120px;background:var(--sun);opacity:.32;animation-duration:19s;animation-delay:-4s}
.bg-glow i:nth-child(3){width:320px;height:320px;left:14%;bottom:-150px;background:var(--d3);opacity:.26;animation-duration:24s;animation-delay:-9s}
.bg-glow i:nth-child(4){width:190px;height:190px;top:38%;right:6%;background:var(--d2);opacity:.24;filter:blur(50px);animation-duration:17s;animation-delay:-2s}
.bg-glow .dust{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.9),rgba(255,255,255,0) 70%);filter:blur(3px)}
.bg-glow .dust:nth-of-type(1){width:10px;height:10px;top:22%;left:12%;opacity:.5;animation:drift 14s ease-in-out infinite alternate}
.bg-glow .dust:nth-of-type(2){width:14px;height:14px;top:58%;right:14%;opacity:.4;animation:drift 18s ease-in-out infinite alternate-reverse}
.bg-glow .dust:nth-of-type(3){width:8px;height:8px;top:78%;left:32%;opacity:.45;animation:drift 12s ease-in-out infinite alternate}
@keyframes drift{0%{transform:translate(0,0) scale(1)}100%{transform:translate(14px,-18px) scale(1.06)}}
@media (prefers-reduced-motion:reduce){.bg-glow i,.bg-glow .dust{animation:none}}

/* 共用毛玻璃卡片樣式：柔霧透光＋邊緣高光，模擬真實磨砂玻璃的光澤感 */
.glass{background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);
border:1px solid var(--glass-line);box-shadow:var(--glass-sheen)}

/* Header */
.app-header{display:flex;justify-content:space-between;align-items:flex-start;padding:22px 18px 4px}
.app-title{font-family:'Noto Serif TC',serif;font-size:25px;font-weight:700}
.app-sub{font-size:12px;color:var(--muted);margin-top:4px}
.app-icons{display:flex;gap:8px;flex-shrink:0}
.icon-btn{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;
box-shadow:var(--shadow-soft);font-size:15px;touch-action:manipulation;transition:transform .15s ease,box-shadow .15s ease}
.icon-btn:active{transform:scale(.92);box-shadow:var(--shadow-soft),var(--glass-sheen)}

/* Day tabs */
/* Day tabs：不要玻璃底色，只保留每個籤下方的顏色底線 */
.day-tabs{display:flex;gap:22px;padding:18px 18px 2px;overflow-x:auto}
.day-tab{font-size:15px;color:var(--muted);font-weight:600;white-space:nowrap;padding-bottom:9px;
border:none;border-bottom:2px solid transparent;background:none}
.day-tab.active{color:var(--ink);font-weight:700}
.day-tab.active.a1{border-color:var(--d1)}
.day-tab.active.a2{border-color:var(--d2)}
.day-tab.active.a3{border-color:var(--d3)}
.day-desc{padding:10px 18px 2px;font-size:12px;color:var(--muted)}

/* Carousel */
.carousel{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;padding:30px 22px 42px;scroll-padding:0 22px;
-webkit-overflow-scrolling:touch}
.c-card{scroll-snap-align:center;flex:0 0 68%;aspect-ratio:1/1;border-radius:26px;position:relative;overflow:hidden;
background-size:cover;background-position:center;box-shadow:var(--shadow),var(--card-sheen);transform:scale(.92);opacity:.7;
transition:transform .28s ease,opacity .28s ease,box-shadow .28s ease;cursor:pointer;touch-action:manipulation}
.c-card.focus{box-shadow:var(--shadow-lg),var(--card-sheen)}
.c-card:active{transform:scale(.97)!important}
.c-card.focus{transform:scale(1);opacity:1}
.c-card.has-photo,.chip-thumb.has-photo,.detail-hero.has-photo{background-color:#1c2016}
.c-card::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 45%,rgba(6,10,6,.72) 100%)}
.ph-icon{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:46px;opacity:.55}
.has-photo .ph-icon{display:none}
.c-badge{position:absolute;top:14px;left:14px;z-index:2;background:rgba(20,22,14,.34);color:#fff;font-size:11.5px;
padding:5px 11px;border-radius:99px;backdrop-filter:blur(10px) saturate(160%);-webkit-backdrop-filter:blur(10px) saturate(160%);border:1px solid rgba(255,255,255,.28)}
.c-info{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:16px 18px 18px}
.c-time{font-size:11.5px;color:rgba(255,255,255,.85);letter-spacing:.04em;font-variant-numeric:tabular-nums}
.c-title{font-size:19px;font-weight:700;color:#fff;margin-top:4px;line-height:1.3}
.c-loc{font-size:12.5px;color:rgba(255,255,255,.8);margin-top:4px}

/* Chip strip */
.section-head{display:flex;justify-content:space-between;align-items:center;padding:2px 18px 8px}
.section-title{font-size:14.5px;font-weight:700}
.section-hint{font-size:11px;color:var(--muted)}
.chip-strip{display:flex;gap:12px;overflow-x:auto;padding:14px 22px 32px;scroll-snap-type:x proximity;scroll-padding:0 22px;
-webkit-overflow-scrolling:touch}
.chip-card{scroll-snap-align:center;flex:0 0 108px;border-radius:16px;
overflow:hidden;box-shadow:var(--shadow-soft),var(--glass-sheen);transform:scale(.94);transition:transform .2s ease,box-shadow .2s ease;
cursor:pointer;touch-action:manipulation}
.chip-card.focus{transform:scale(1.04);box-shadow:var(--shadow),var(--glass-sheen)}
.chip-thumb{height:68px;background-size:cover;background-position:center;position:relative}
.chip-time{position:absolute;top:5px;left:5px;font-size:9.5px;background:rgba(20,22,14,.4);color:#fff;padding:2px 6px;border-radius:99px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.25)}
.chip-body{padding:8px 9px 10px}
.chip-title{font-size:11.5px;font-weight:600;line-height:1.35;color:var(--ink);display:-webkit-box;
-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* Type colors (shared across card / chip / detail hero) */
.c-card.type-eat,.chip-card.type-eat .chip-thumb,.detail-hero.type-eat{background:linear-gradient(160deg,#F7CE94,#E2963A)}
.c-card.type-see,.chip-card.type-see .chip-thumb,.detail-hero.type-see{background:linear-gradient(160deg,#A9D3F2,#3E8FD1)}
.c-card.type-hot,.chip-card.type-hot .chip-thumb,.detail-hero.type-hot{background:linear-gradient(160deg,#DCC4F0,#A374CB)}
.c-card.type-drv,.chip-card.type-drv .chip-thumb,.detail-hero.type-drv{background:linear-gradient(160deg,#D6D9C9,#8A9078)}

/* Views */
.view{display:none}
.view.active{display:block}

/* Info page */
.info-wrap{padding:18px 18px 4px}
.info-title{font-family:'Noto Serif TC',serif;font-size:20px;font-weight:700;margin-bottom:4px}
.info-sub{font-size:12.5px;color:var(--muted);margin-bottom:14px}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px}
.chip{font-size:12px;padding:7px 12px;border-radius:99px;background:var(--glass);-webkit-backdrop-filter:blur(16px) saturate(180%);backdrop-filter:blur(16px) saturate(180%);border:1px solid var(--glass-line);
box-shadow:var(--shadow-soft),var(--glass-sheen);white-space:nowrap}
.notice{border-radius:14px;background:rgba(251,239,232,.55);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);border:1px solid rgba(240,210,190,.85);padding:14px;box-shadow:var(--shadow-soft),inset 0 1px 0 rgba(255,255,255,.7)}
.notice-line{font-size:12.5px;color:var(--ink);line-height:1.65;padding-left:15px;position:relative}
.notice-line+.notice-line{margin-top:8px}
.notice-line::before{content:'!';position:absolute;left:0;top:0;color:#D9713F;font-weight:700;font-size:12.5px}

/* Panels */
.panel{margin:18px 18px 0;background:var(--glass);-webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%);border:1px solid var(--glass-line);border-radius:18px;padding:16px 16px 18px;box-shadow:var(--shadow),var(--glass-sheen)}
.panel-h{font-size:14px;font-weight:700;color:var(--ink);margin-bottom:10px}
.brow{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.brow:last-of-type{border-bottom:none}
.brow .l{color:var(--ink)}
.brow .v{color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.btotal{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline}
.btotal .l{font-size:13.5px;font-weight:700;color:var(--ink)}
.btotal .v{font-size:19px;font-weight:700;color:var(--d1);font-family:'Noto Serif TC',serif}
.budget-note{font-size:11.5px;color:var(--muted);margin-top:10px;line-height:1.65}

/* Checklist */
.checklist-item{display:flex;align-items:center;gap:10px;padding:12px 4px;border-bottom:1px solid var(--line);touch-action:manipulation}
.checklist-item:last-child{border-bottom:none}
.checklist-box{width:24px;height:24px;border-radius:7px;border:1.5px solid var(--glass-line-soft);flex-shrink:0;
display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;background:rgba(255,255,255,.55)}
.checklist-item.checked .checklist-box{background:var(--d1);border-color:var(--d1)}
.checklist-text{font-size:13px;color:var(--ink);flex:1}
.checklist-item.checked .checklist-text{color:var(--muted);text-decoration:line-through}

/* Bottom nav */
.bottom-nav{position:fixed;left:16px;right:16px;bottom:calc(14px + env(safe-area-inset-bottom));max-width:448px;margin:0 auto;
background:var(--glass);backdrop-filter:blur(26px) saturate(190%);-webkit-backdrop-filter:blur(26px) saturate(190%);
border:1px solid var(--glass-line);
border-radius:28px;display:flex;justify-content:space-around;padding:9px;z-index:60;box-shadow:0 14px 30px -16px rgba(60,55,35,.24),var(--glass-sheen)}
.nav-btn{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;
color:var(--muted);font-size:17px;background:none;border:none;touch-action:manipulation;transition:background .18s ease,color .18s ease}
.nav-btn:active,.icon-btn:active{transform:scale(.92)}
.nav-btn.active{background:var(--ink);color:#fff;box-shadow:0 6px 16px -6px rgba(20,20,10,.5)}

/* Detail overlay */
.detail-overlay{position:fixed;inset:0;z-index:100;background:var(--bg);transform:translateY(100%);
transition:transform .34s cubic-bezier(.22,.9,.32,1);overflow-y:auto;-webkit-overflow-scrolling:touch;max-width:480px;margin:0 auto}
.detail-overlay.open{transform:translateY(0)}
.detail-hero-wrap{padding:24px 16px 0}
.detail-hero{position:relative;min-height:300px;border-radius:26px;overflow:hidden;background-size:cover;background-position:center;box-shadow:var(--shadow-lg)}
.detail-hero::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05) 55%,rgba(6,10,6,.35) 100%)}
.detail-top{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:16px;z-index:2}
.circle-btn{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.22);backdrop-filter:blur(8px);
display:flex;align-items:center;justify-content:center;color:#fff;font-size:19px;border:1px solid rgba(255,255,255,.3);touch-action:manipulation}
.circle-btn:active{transform:scale(.92)}
.detail-gallery{position:absolute;top:66px;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:2;
overflow-y:auto;-webkit-overflow-scrolling:touch;scroll-snap-type:y proximity;padding-bottom:4px}
.detail-gallery::-webkit-scrollbar{display:none}
.detail-thumb{width:56px;height:56px;border-radius:14px;background-size:cover;background-position:center;flex-shrink:0;
background-color:rgba(255,255,255,.15);border:2px solid rgba(255,255,255,.55);touch-action:manipulation;transition:transform .15s ease,border-color .15s ease;scroll-snap-align:end}
.detail-thumb:active{transform:scale(.92)}
.detail-thumb.current{border-color:#fff;box-shadow:0 0 0 2px rgba(0,0,0,.25)}

.thumb-lightbox{position:fixed;inset:0;z-index:200;background:rgba(10,12,8,.8);display:flex;align-items:center;
justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s ease}
.thumb-lightbox.open{opacity:1;pointer-events:auto}
.thumb-lightbox img{width:78vw;max-width:340px;aspect-ratio:1/1;object-fit:cover;border-radius:22px;box-shadow:0 24px 60px rgba(0,0,0,.5)}
.detail-heading{padding:16px 18px 4px}
.detail-eyebrow{font-size:11.5px;color:var(--muted);margin-bottom:5px;letter-spacing:.04em}
.detail-title{font-family:'Noto Serif TC',serif;font-size:21px;font-weight:700;color:var(--ink);line-height:1.35}
.detail-loc{font-size:12.5px;color:var(--muted);margin-top:6px}
.detail-loc.mappable{display:inline-flex;align-items:center;gap:5px;color:#2C7AA8;font-weight:600;
padding:6px 2px;margin:2px 0 0 -2px;touch-action:manipulation;text-decoration:none}
.detail-loc.mappable:active{opacity:.6}
.detail-loc.mappable .pin{font-size:13px}
.detail-loc.mappable .go-hint{color:var(--muted);font-weight:400;font-size:11.5px;margin-left:1px}

/* 詳情頁圖文並茂：文字說明下方的照片區 */
.detail-photos{margin-top:18px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.detail-photos.single{grid-template-columns:1fr}
.detail-photo{aspect-ratio:4/3;border-radius:16px;background-size:cover;background-position:center;
box-shadow:var(--shadow),var(--card-sheen);background-color:#eee2}
.detail-photos.single .detail-photo{aspect-ratio:16/10}
.detail-body{position:relative;padding:14px 20px calc(110px + env(safe-area-inset-bottom));min-height:30vh}
.detail-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:8px}
.dstat{background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(180%);backdrop-filter:blur(18px) saturate(180%);border:1px solid var(--glass-line);border-radius:14px;padding:13px 6px;text-align:center;box-shadow:var(--shadow-soft),var(--glass-sheen)}
.dstat-label{font-size:10.5px;color:var(--muted)}
.dstat-val{font-size:13px;font-weight:700;margin-top:5px;line-height:1.3}
.detail-desc-h{font-size:14.5px;font-weight:700;margin-top:22px}
.detail-desc{font-size:13.5px;color:#5B5F4A;line-height:1.75;margin-top:9px}
.detail-bottom{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(160%);backdrop-filter:blur(24px) saturate(160%);border-top:1px solid var(--glass-line);
padding:14px 20px calc(14px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:center;z-index:4}
.detail-price-label{font-size:11px;color:var(--muted)}
.detail-price-val{font-size:18.5px;font-weight:700;font-family:'Noto Serif TC',serif}
.detail-go{width:48px;height:48px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;
justify-content:center;font-size:18px;text-decoration:none;flex-shrink:0;touch-action:manipulation}
.detail-go:active{transform:scale(.94)}
</style>
</head>
<body>

<div class="app-header">
  <div>
    <div class="app-title" id="siteTitle">知本解憂．藍皮慢行</div>
    <div class="app-sub" id="siteSub">Taitung · 3 Days ｜不趕、少走路的泡湯提案</div>
  </div>
  <div class="app-icons"><button class="icon-btn glass" onclick="switchView('info')">ℹ️</button></div>
</div>

<div class="day-tabs" id="dayTabs"></div>
<div class="bg-glow"><i></i><i></i><i></i><i></i><span class="dust"></span><span class="dust"></span><span class="dust"></span></div>
<div class="day-desc" id="dayDesc"></div>

<div id="view-discover" class="view active">
  <div class="carousel" id="carousel"></div>
  <div class="section-head">
    <div class="section-title">當日時刻總覽</div>
    <div class="section-hint">點一下放大／點大圖看細節</div>
  </div>
  <div class="chip-strip" id="chipStrip"></div>
</div>

<div id="view-info" class="view">
  <div class="info-wrap">
    <div class="info-title" id="infoTitle">行前須知</div>
    <div class="info-sub" id="infoSub">出發前先看一眼，路上更安心</div>
    <div class="chips" id="chipsWrap"></div>
    <div class="notice" id="noticeWrap"></div>
  </div>
  <div class="panel" style="margin-top:16px">
    <div class="panel-h" style="display:flex;justify-content:space-between;align-items:center">
      <span>✅ 行前準備清單</span>
      <span id="checklistProgress" style="font-size:11.5px;font-weight:400;color:var(--muted)">0/0</span>
    </div>
    <div id="checklistWrap"></div>
  </div>
</div>

<div id="view-budget" class="view">
  <div class="panel">
    <div class="panel-h">💰 預算（每人，已壓縮）</div>
    <div id="budgetRows"></div>
    <div class="btotal"><div class="l">總計</div><div class="v" id="budgetTotal">—</div></div>
    <div class="budget-note" id="budgetNote"></div>
  </div>
</div>

<div id="view-split" class="view">
  <div class="panel" id="splitBox">
    <div class="panel-h">👫 分帳小工具</div>
    <div id="splitRows"></div>
    <button id="addRowBtn" style="width:100%;margin-top:6px;padding:10px;border-radius:8px;border:1px dashed var(--line);background:none;color:var(--muted);font-size:13px">＋ 新增支出</button>
    <div style="display:flex;gap:8px;margin-top:12px">
      <div style="flex:1;background:rgba(47,160,196,.10);border-radius:8px;padding:9px;text-align:center">
        <div style="font-size:11.5px;color:var(--muted)">Gina 已付</div>
        <div id="paidA" style="font-size:16.5px;font-weight:700;color:var(--d1)">$0</div>
      </div>
      <div style="flex:1;background:rgba(199,154,75,.12);border-radius:8px;padding:9px;text-align:center">
        <div style="font-size:11.5px;color:var(--muted)">念臻 已付</div>
        <div id="paidB" style="font-size:16.5px;font-weight:700;color:var(--d2)">$0</div>
      </div>
    </div>
    <div class="btotal" id="settleRow">
      <div class="l">結算</div>
      <div class="v" id="settleText" style="font-size:14.5px">尚無支出</div>
    </div>
  </div>
</div>

function renderNotices() {

function rowAmount(r) {
  // 優先用 amount 欄位；如果試算表沒填、填成文字或算不出數字，就自動從 display（例如「約$2,280」）擷取數字當備援，
  // 這樣就不會因為 amount 沒對到而讓總計整個變 0。
  const n = Number(r.amount);
  if (Number.isFinite(n) && n > 0) return n;
  const digits = String(r.display || '').replace(/[^0-9.]/g, '');
  return digits ? Number(digits) || 0 : 0;
}
function renderBudget() {
  document.getElementById('budgetRows').innerHTML = budgetRows.map(r =>

  const total = budgetRows.reduce((s, r) => s + rowAmount(r), 0);
  document.getElementById('budgetTotal').textContent = '約$' + total.toLocaleString();
}
function renderChecklist() {
  const wrap = document.getElementById('checklistWrap');
  wrap.innerHTML = '';
  checklist.forEach((item, i) => {

  document.getElementById('checklistProgress').textContent = `${done}/${checklist.length}`;
}

    chip.innerHTML = `<div class="chip-thumb"><span class="chip-time">${s.time.split('–')[0]}</span></div>

      thumb.style.backgroundImage = `url("${s.image}")`;
      thumb.classList.add('has-photo');
    }
    wrap.appendChild(chip);
  });
}

function setupFocusScroll(container, sel) {
  function update() {
    const center = container.getBoundingClientRect().left + container.getBoundingClientRect().width / 2;
    let closest = null, dist = Infinity;
    container.querySelectorAll(sel).forEach(c => {
      const r = c.getBoundingClientRect();
      const d = Math.abs((r.left + r.width / 2) - center);
      if (d < dist) { dist = d; closest = c; }
      c.classList.remove('focus');
    });
    if (closest) closest.classList.add('focus');
  }
  container.addEventListener('scroll', () => requestAnimationFrame(update), { passive:true });
  update();
}

function renderTrip() {
  renderDayTabs();
  renderCarousel();
  renderChipStrip();
  setupFocusScroll(document.getElementById('carousel'), '.c-card');
  setupFocusScroll(document.getElementById('chipStrip'), '.chip-card');
}

  document.getElementById('detailHero').className = 'detail-hero type-' + s.type;

  setHeroPhoto(window.currentDetailPhotoUrl || allPhotos[0] || '');

  document.getElementById('detailTitle').textContent = s.title;

  // 地址列：只要有地址文字（loc）就自動變成可點擊，直接開 Google Maps 搜尋該地點，
  // 不需要每個景點另外去填連結欄位。
  const locEl = document.getElementById('detailLoc');
  const locText = (s.loc || '').replace('📍 ', '').trim();
  if (locText) {
    const mapsUrl = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(locText || s.title);
    locEl.outerHTML = `<a class="detail-loc mappable" id="detailLoc" href="${mapsUrl}" target="_blank" rel="noopener">
        <span class="pin">📍</span><span>${locText}</span><span class="go-hint">・在 Google Maps 開啟</span>
      </a>`;
  } else {
    locEl.outerHTML = `<div class="detail-loc" id="detailLoc">${s.tag || '這一站沒有特別的地址，跟著時刻走就好'}</div>`;
  }

  // 右側縮圖：改成「當天行程導覽」，只放圖片、不放文字，點一下就切到那一站的詳情
  const galWrap = document.getElementById('detailGallery');
  galWrap.innerHTML = '';
  days[dayIdx].stops.forEach((stop, i) => {
    const d = document.createElement('div');
    d.className = 'detail-thumb' + (i === stopIdx ? ' current' : '');
    if (isImg(stop.image)) d.style.backgroundImage = `url("${stop.image}")`;
    d.onclick = () => openDetail(dayIdx, i);
    galWrap.appendChild(d);
  });
  galWrap.querySelector('.detail-thumb.current')?.scrollIntoView({ block:'nearest' });

  const stats = (s.stats && s.stats.length ? s.stats.slice(0, 3) : [
    { l:'時段', v:s.time }, { l:'類型', v:TYPE_LABEL[s.type] }, { l:'備註', v:s.tag || '—' },
  ]);
  document.getElementById('detailStats').innerHTML = stats.map(st =>
    `<div class="dstat"><div class="dstat-label">${st.l}</div><div class="dstat-val">${st.v}</div></div>`).join('');

  document.getElementById('detailDesc').textContent = s.desc || '這一站沒有太多安排，放慢腳步，跟著時刻走就好。';

  // 圖文並茂：說明文字下方再放一組照片（用 gallery 欄位，跟主圖不同的其他照片）
  const photosWrap = document.getElementById('detailPhotos');
  const extraPhotos = (s.gallery || []).filter(isImg).filter(u => u !== s.image);
  if (extraPhotos.length) {
    photosWrap.className = 'detail-photos' + (extraPhotos.length === 1 ? ' single' : '');
    photosWrap.innerHTML = extraPhotos.map(url => `<div class="detail-photo" style="background-image:url('${url}')"></div>`).join('');
  } else {
    photosWrap.innerHTML = '';
  }

  const priceLabel = document.getElementById('detailPriceLabel');
  const priceVal = document.getElementById('detailPriceVal');
  if (s.priceLabel && s.priceValue) { priceLabel.textContent = s.priceLabel; priceVal.textContent = s.priceValue; }
  else if (s.tag && /[\$￥]/.test(s.tag)) { priceLabel.textContent = '參考費用'; priceVal.textContent = s.tag; }
  else { priceLabel.textContent = '時段'; priceVal.textContent = s.time; }

  // 沒有連結的景點，箭頭按鈕直接不顯示，而不是顯示一個點不下去的灰色按鈕
  const goBtn = document.getElementById('detailGo');
  if (s.link) { goBtn.href = s.link; goBtn.style.display = 'flex'; }
  else { goBtn.style.display = 'none'; }

  const overlay = document.getElementById('detailOverlay');
  const wasOpen = overlay.classList.contains('open');
  overlay.classList.add('open');
  overlay.scrollTop = 0;
  document.body.style.overflow = 'hidden';
  if (!wasOpen) history.pushState({ detail:true }, '');
}

function setHeroPhoto(url) {
  const hero = document.getElementById('detailHero');
  if (url) { hero.style.backgroundImage = `url("${url}")`; hero.classList.add('has-photo'); }
  else { hero.style.backgroundImage = 'none'; hero.classList.remove('has-photo'); }
}

function closeDetail(skipHistory) {
  const overlay = document.getElementById('detailOverlay');
  if (!overlay.classList.contains('open')) return;
  overlay.classList.remove('open');
  document.body.style.overflow = '';
  if (!skipHistory && history.state && history.state.detail) history.back();
}
window.addEventListener('popstate', () => closeDetail(true));

(function setupSwipeToClose() {
  const overlay = document.getElementById('detailOverlay');
  let startY = 0, dragging = false;
  overlay.addEventListener('touchstart', e => { startY = e.touches[0].clientY; dragging = overlay.scrollTop <= 0; }, { passive:true });
  overlay.addEventListener('touchmove', e => {
    if (!dragging) return;
    const dy = e.touches[0].clientY - startY;
    if (dy > 0) overlay.style.transform = `translateY(${Math.min(dy, 220)}px)`;
  }, { passive:true });
  overlay.addEventListener('touchend', e => {
    if (!dragging) return;
    const dy = e.changedTouches[0].clientY - startY;
    overlay.style.transform = '';
    dragging = false;
    if (dy > 110) closeDetail();
  });
})();

/* ============ 底部導覽 ============ */
function switchView(name, btn) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById('view-' + name).classList.add('active');
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  (btn || document.querySelector(`.nav-btn[data-nav="${name}"]`))?.classList.add('active');
  const show = name === 'discover';
  document.getElementById('dayTabs').style.display = show ? 'flex' : 'none';
  document.getElementById('dayDesc').style.display = show ? 'block' : 'none';
}

/* ============ 分帳小工具（自動記住上次填的內容） ============ */
const SPLIT_STORAGE_KEY = 'zhiben-trip-split-v1';
const DEFAULT_EXPENSES = [
  { name:'知本溫泉一泊二食', amount:4560, payer:'A' },
  { name:'市區住宿 1 晚', amount:1500, payer:'B' },
  { name:'藍皮解憂號套票 x2', amount:1398, payer:'A' },
];
/* ============ 分帳資料：改成跟 Apps Script 讀寫，兩人共用同一份 ============
 * 邏輯：打開頁面先跟後端要一次最新資料；之後每次編輯都會整批存回後端；
 * 同時每隔幾秒背景輪詢一次，讓對方存的更動也能同步過來。
 * 注意：這是「整批覆蓋」同步，不是逐格即時同步——如果兩人「同一秒」都在編輯，
 * 後存的會蓋掉先存的。一般兩人輪流填、隔幾秒看一下的用法完全沒問題。
 * ================================================= */
function loadExpensesLocal() {
  try {
    const saved = localStorage.getItem(SPLIT_STORAGE_KEY);
    if (saved) {
      const parsed = JSON.parse(saved);
      if (Array.isArray(parsed)) return parsed;
    }
  } catch (e) { console.warn('讀取本機分帳快取失敗，改用預設內容', e); }
  return DEFAULT_EXPENSES;
}
function cacheExpensesLocal() {
  try { localStorage.setItem(SPLIT_STORAGE_KEY, JSON.stringify(expenses)); }
  catch (e) { console.warn('本機分帳快取失敗', e); }
}
let expenses = loadExpensesLocal(); // 開頭先用本機快取墊著，避免畫面閃空，稍後會被雲端資料覆蓋
let expensesSyncTimer = null;
let expensesSavingTimer = null;
let expensesEditingNow = false; // 使用者正在打字時，暫停輪詢覆蓋畫面

async function fetchExpensesFromCloud() {
  if (!DATA_API_URL) return;
  try {
    const url = DATA_API_URL.trim() + (DATA_API_URL.includes('?') ? '&' : '?') + 'action=expenses&ts=' + Date.now();
    const res = await fetch(url, { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const json = await res.json();
    if (json.error) { console.warn('分帳資料讀取錯誤：' + json.error); return; }
    if (Array.isArray(json.expenses) && !expensesEditingNow) {
      expenses = json.expenses;
      cacheExpensesLocal();
      renderSplit();
    }
  } catch (e) { console.warn('分帳資料讀取失敗，暫用本機快取', e); }
}

async function saveExpensesToCloud() {
  if (!DATA_API_URL) { cacheExpensesLocal(); return; }
  cacheExpensesLocal();
  try {
    // 用 text/plain 送出，避免瀏覽器對 Apps Script 發出 CORS 預檢請求（Apps Script 不支援預檢，會直接失敗）
    await fetch(DATA_API_URL.trim(), {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'saveExpenses', expenses }),
    });
  } catch (e) { console.warn('分帳資料存雲端失敗，已保留在本機', e); }
}
function saveExpenses() {
  // 打字時先本機存一份、debounce 0.7 秒再整批送雲端，避免每敲一個字就打一次 API
  cacheExpensesLocal();
  clearTimeout(expensesSavingTimer);
  expensesSavingTimer = setTimeout(saveExpensesToCloud, 700);
}
function startExpensesSync() {
  fetchExpensesFromCloud();
  if (expensesSyncTimer) clearInterval(expensesSyncTimer);
  expensesSyncTimer = setInterval(fetchExpensesFromCloud, 6000); // 每 6 秒背景同步一次對方的更動
}
function renderSplit() {
  const rowsEl = document.getElementById('splitRows');
  rowsEl.innerHTML = '';
  expenses.forEach((e, i) => {
    const row = document.createElement('div');
    row.style.cssText = 'display:flex;gap:6px;align-items:center;margin-bottom:6px';
    row.innerHTML = `
      <input type="text" value="${e.name}" placeholder="項目" style="flex:2;min-width:0;padding:8px;border-radius:7px;border:1px solid var(--glass-line-soft);background:rgba(255,255,255,.55);backdrop-filter:blur(10px);color:var(--ink);font-size:13px">
      <input type="number" value="${e.amount}" placeholder="金額" style="flex:1.3;min-width:0;padding:8px;border-radius:7px;border:1px solid var(--glass-line-soft);background:rgba(255,255,255,.55);backdrop-filter:blur(10px);color:var(--ink);font-size:13px">
      <select style="flex:1;padding:8px 4px;border-radius:7px;border:1px solid var(--glass-line-soft);background:rgba(255,255,255,.55);backdrop-filter:blur(10px);color:var(--ink);font-size:13px">
        <option value="A" ${e.payer==='A'?'selected':''}>Gina付</option>
        <option value="B" ${e.payer==='B'?'selected':''}>念臻付</option>
      </select>
      <button style="padding:7px 10px;border-radius:7px;border:1px solid var(--glass-line-soft);background:none;color:#D9713F;font-size:13px">✕</button>`;
    const [nameInput, amountInput, payerSelect, delBtn] = row.children;
    const markEditing = () => { expensesEditingNow = true; clearTimeout(window.__editIdleTimer); window.__editIdleTimer = setTimeout(() => { expensesEditingNow = false; }, 1500); };
    nameInput.oninput = () => { markEditing(); expenses[i].name = nameInput.value; saveExpenses(); };
    amountInput.oninput = () => { markEditing(); expenses[i].amount = Number(amountInput.value) || 0; calcSettle(); saveExpenses(); };
    payerSelect.onchange = () => { expenses[i].payer = payerSelect.value; calcSettle(); saveExpenses(); };
    delBtn.onclick = () => { expenses.splice(i, 1); renderSplit(); saveExpenses(); };
    rowsEl.appendChild(row);
  });
  calcSettle();
}
function calcSettle() {
  const paidA = expenses.filter(e => e.payer === 'A').reduce((s, e) => s + e.amount, 0);
  const paidB = expenses.filter(e => e.payer === 'B').reduce((s, e) => s + e.amount, 0);
  document.getElementById('paidA').textContent = '$' + paidA.toLocaleString();
  document.getElementById('paidB').textContent = '$' + paidB.toLocaleString();
  const total = paidA + paidB;
  const settleText = document.getElementById('settleText');
  if (total === 0) { settleText.textContent = '尚無支出'; return; }
  const diff = paidA - total / 2;
  if (Math.abs(diff) < 1) settleText.textContent = '兩人打平';
  else if (diff > 0) settleText.textContent = `念臻需付 Gina $${Math.round(diff).toLocaleString()}`;
  else settleText.textContent = `Gina需付念臻 $${Math.round(-diff).toLocaleString()}`;
}
document.getElementById('addRowBtn').onclick = () => { expenses.push({ name:'', amount:0, payer:'A' }); renderSplit(); saveExpenses(); };

/* ============ Google 試算表串接 ============
 * 部署好 Apps Script 後，把網址貼在下面 DATA_API_URL。
 * 標題、須知、預算、清單、每日行程（含圖片）都會整批換成試算表內容；
 * 留空或讀取失敗時，自動使用上面內建的預設內容，頁面不會空白。
 * 完整欄位設定，請看隨附的「Google試算表欄位對照.md」與「行程資料API.gs」。
 * ================================================= */
const DATA_API_URL = "https://script.google.com/macros/s/AKfycbyUU_yCCJJj6sU5fVimHJI1uy-P4MPPBC3nfHvikEhryleF1KnuhB_LCv4rFzoXO6X7aw/exec"; // ← 貼你部署好的 Apps Script 網址

async function loadTripData() {
  if (!DATA_API_URL) return;
  try {
    // 加上時間戳並關閉快取：Google Apps Script 的網址常被瀏覽器／中繼快取記住舊回應，
    // 導致試算表明明更新了，網頁重新整理卻還是讀到舊資料。這裡強制每次都拿最新版本。
    const url = DATA_API_URL.trim() + (DATA_API_URL.includes('?') ? '&' : '?') + 'ts=' + Date.now();
    const res = await fetch(url, { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const json = await res.json();
    if (json.error) { console.warn('試算表回傳錯誤：' + json.error); return; }

    if (json.meta) Object.assign(meta, json.meta);
    if (Array.isArray(json.chips) && json.chips.length) chips = json.chips;
    if (Array.isArray(json.notices) && json.notices.length) notices = json.notices;
    if (json.budget && Array.isArray(json.budget.rows) && json.budget.rows.length) budgetRows = json.budget.rows;
    if (Array.isArray(json.checklist) && json.checklist.length) checklist = json.checklist.map(t => ({ text:t, checked:false }));
    if (Array.isArray(json.days) && json.days.length && json.days.every(d => Array.isArray(d.stops))) {
      days = json.days;
      if (currentDay >= days.length) currentDay = 0;
    }

    renderStaticContent();
    renderTrip();
    if (document.getElementById('detailOverlay').classList.contains('open') && window.currentDetail) {
      openDetail(window.currentDetail.day, window.currentDetail.stop);
    }
  } catch (e) {
    console.warn('行程資料載入失敗，改用內建預設內容。請確認 Apps Script 已部署為「所有人」可存取', e);
  }
}

/* ============ 初始化 ============ */
renderStaticContent();
renderTrip();
renderSplit();
loadTripData();
startExpensesSync();
</script>
